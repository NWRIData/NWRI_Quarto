name: Full Data Pipeline

on:
  push:
    branches: [main]
  schedule:
    # Weekdays only (1–5 = Mon–Fri)
    # DST: March–November
    - cron: '0 11 * 3-11 1-5'   # 7 AM ET
    - cron: '0 19 * 3-11 1-5'   # 3 PM ET
    # Standard Time: Jan, Feb, Dec
    - cron: '0 12 * 1,2,12 1-5' # 7 AM ET
    - cron: '0 20 * 1,2,12 1-5' # 3 PM ET
  workflow_dispatch:

jobs:
  # ---- Job 1: Download from Dropbox ----
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python and Dropbox SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install dropbox

      - name: Run Python script
        run: python dropbox_api.py

      # Upload eligibility table as its own artifact
      - name: Upload eligibility table artifact
        uses: actions/upload-artifact@v4
        with:
          name: dropbox-eligibility
          path: reports/Eligiblity_table_2526/dropbox_data/latest_file.csv

      # Upload heatmap table as its own artifact
      - name: Upload heatmap table artifact
        uses: actions/upload-artifact@v4
        with:
          name: dropbox-heatmap
          path: reports/heatmap_districts/dropbox_data/latest_file.csv

  # ---- Job 2: R Data Processing ----
  process-eligibility:
    runs-on: ubuntu-latest
    needs: download
    steps:
      - uses: actions/checkout@v4

      # Download only the eligibility table artifact
      - uses: actions/download-artifact@v4
        with:
          name: dropbox-eligibility
          path: reports/Eligiblity_table_2526/dropbox_data/

      - uses: r-lib/actions/setup-r@v2
      - name: Install R packages
        run: Rscript -e 'install.packages(c("dplyr","here","stringr"), repos="https://cloud.r-project.org")'

      - name: Run eligibility processing
        run: Rscript reports/Eligiblity_table_2526/setting_up_eligibility_data.R

      # Upload the latest processed RDS file as an artifact
      - name: Upload eligibility outputs
        run: |
          latest_file=$(ls -1t reports/Eligiblity_table_2526/data/final_table*.rds | head -n 1)
          echo "Uploading $latest_file"
          echo "latest_file=$latest_file" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: eligibility-data
          path: ${{ env.latest_file }}

  # ---- Job 3: Heatmap Processing ----
  process-heatmap:
    runs-on: ubuntu-latest
    needs: download
    steps:
      - uses: actions/checkout@v4

      # Download only the heatmap table artifact
      - uses: actions/download-artifact@v4
        with:
          name: dropbox-heatmap
          path: reports/heatmap_districts/dropbox_data/

      - uses: r-lib/actions/setup-r@v2
      - name: Install R packages
        run: Rscript -e 'install.packages(c("dplyr","here","tidyr","lubridate","reactable"), repos="https://cloud.r-project.org")'

      - name: Run heatmap processing
        run: Rscript reports/heatmap_districts/setting_up_enrollment_heat.R

      # Upload processed heatmap outputs
      - name: Upload heatmap outputs
        uses: actions/upload-artifact@v4
        with:
          name: heatmap-data
          path:  |
            reports/heatmap_districts/heatmapdata/*.rds
            reports/heatmap_districts/heatmapdataweekly/*.rds
            reports/heatmap_districts/reactable_element/*.rds

  # ---- Job 4: Render Quarto + Final Commit ----
  render:
    runs-on: ubuntu-latest
    needs: [process-eligibility, process-heatmap]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Download all required artifacts for final rendering
      - uses: actions/download-artifact@v4
        with:
          name: dropbox-eligibility
          path: reports/Eligiblity_table_2526/dropbox_data/
      - uses: actions/download-artifact@v4
        with:
          name: eligibility-data
          path: reports/Eligiblity_table_2526/
      - uses: actions/download-artifact@v4
        with:
          name: dropbox-heatmap
          path: reports/heatmap_districts/dropbox_data/
      - uses: actions/download-artifact@v4
        with:
          name: heatmap-data
          path: reports/heatmap_districts/

      - uses: r-lib/actions/setup-r@v2
      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libcairo2-dev libgit2-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c(
            "tidyr","stringr","lubridate","dplyr","scales","viridis",
            "wesanderson","htmlwidgets","htmltools","reactable","reactablefmtr"
          ), repos="https://cloud.r-project.org")'

      - name: Render Quarto doc
        run: |
          quarto render reports/Eligiblity_table_2526/Eligibility_table.qmd --to html --output-dir docs
          quarto render reports/heatmap_districts/Heatmap_table.qmd --to html --output-dir docs

      - name: Commit all changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add -A
          git commit -m "Pipeline update $(date -u +'%Y-%m-%d') [skip ci]" || echo "No changes to commit"
          git push
