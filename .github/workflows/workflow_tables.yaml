name: Full Data Pipeline

on:
  push:
    branches: [main]

  workflow_dispatch:

  # Schedule: 7 AM / 3 PM ET, weekdays, all months
  schedule:
    - cron: '0 11 * * 1-5'
    - cron: '0 19 * * 1-5'

jobs:

  # =========================================================
  # JOB 1 — DOWNLOAD FROM DROPBOX
  # =========================================================
  download:
    runs-on: ubuntu-latest
    outputs:
      elig_file: ${{ steps.paths.outputs.elig }}
      heat_file: ${{ steps.paths.outputs.heat }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Python + Dropbox SDK
        run: pip install dropbox

      - name: Run Dropbox API Pull
        run: python dropbox_api.py

      - name: Detect downloaded filenames
        id: paths
        run: |
          elig=$(ls -1t reports/Eligiblity_table_2526/dropbox_data/*.csv 2>/dev/null | head -n 1)
          heat=$(ls -1t reports/heatmap_districts/dropbox_data/*.csv 2>/dev/null | head -n 1)

          echo "elig=$elig" >> $GITHUB_OUTPUT
          echo "heat=$heat" >> $GITHUB_OUTPUT

      - name: Upload eligibility CSV
        uses: actions/upload-artifact@v4
        with:
          name: dropbox-eligibility
          path: ${{ steps.paths.outputs.elig }}
          if-no-files-found: error

      - name: Upload heatmap CSV
        uses: actions/upload-artifact@v4
        with:
          name: dropbox-heatmap
          path: ${{ steps.paths.outputs.heat }}
          if-no-files-found: error

  # =========================================================
  # JOB 2 — PROCESS ELIGIBILITY
  # =========================================================
  process-eligibility:
    runs-on: ubuntu-latest
    needs: download

    steps:
      - uses: actions/checkout@v4

      - name: Download raw CSV artifact
        uses: actions/download-artifact@v4
        with:
          name: dropbox-eligibility
          path: temp/raw-eligibility/

      - name: Ensure directory structure
        run: |
          mkdir -p reports/Eligiblity_table_2526/dropbox_data
          mkdir -p reports/Eligiblity_table_2526/data
          mkdir -p reports/Eligiblity_table_2526/nonmatch_data
          mkdir -p reports/Eligiblity_table_2526/heatmapdataweekly
          mkdir -p reports/Eligiblity_table_2526/last_processed

      - name: Move CSV into project
        run: |
          cp temp/raw-eligibility/*.csv reports/Eligiblity_table_2526/dropbox_data/ || true

      - uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("dplyr","tidyr","stringr","lubridate","here"), repos="https://cloud.r-project.org")'

      - name: Process eligibility data
        run: Rscript reports/Eligiblity_table_2526/setting_up_eligibility_data.R

      - name: Upload all processed eligibility outputs
        uses: actions/upload-artifact@v4
        with:
          name: eligibility-processed
          path: reports/Eligiblity_table_2526/
          if-no-files-found: error

  # =========================================================
  # JOB 3 — PROCESS HEATMAP
  # =========================================================
  process-heatmap:
    runs-on: ubuntu-latest
    needs: download

    steps:
      - uses: actions/checkout@v4

      - name: Download raw heatmap CSV aritfact
        uses: actions/download-artifact@v4
        with:
          name: dropbox-heatmap
          path: temp/raw-heatmap/

      - name: Ensure directory structure
        run: |
          mkdir -p reports/heatmap_districts/dropbox_data
          mkdir -p reports/heatmap_districts/heatmapdata
          mkdir -p reports/heatmap_districts/heatmapdataweekly
          mkdir -p reports/heatmap_districts/reactable_element
          mkdir -p reports/heatmap_districts/last_processed

      - name: Move CSV into project
        run: |
          cp temp/raw-heatmap/*.csv reports/heatmap_districts/dropbox_data/ || true

      - uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("dplyr","tidyr","lubridate","reactable","here"), repos="https://cloud.r-project.org")'

      - name: Process heatmap data
        run: Rscript reports/heatmap_districts/setting_up_enrollment_heat.R

      - name: Upload full heatmap processed output
        uses: actions/upload-artifact@v4
        with:
          name: heatmap-processed
          path: reports/heatmap_districts/
          if-no-files-found: error

  # =========================================================
  # JOB 4 — MERGE, RENDER, COMMIT
  # =========================================================
  render:
    runs-on: ubuntu-latest
    needs: [process-eligibility, process-heatmap]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # 🔥 FIX: The missing step — download processed artifacts!
      - name: Download processed eligibility
        uses: actions/download-artifact@v4
        with:
          name: eligibility-processed
          path: temp/eligibility-processed/

      - name: Download processed heatmap
        uses: actions/download-artifact@v4
        with:
          name: heatmap-processed
          path: temp/heatmap-processed/

      - name: Merge artifacts back into repo
        run: |
          cp -r temp/eligibility-processed/* reports/Eligiblity_table_2526/ || true
          cp -r temp/heatmap-processed/*   reports/heatmap_districts/ || true

      - uses: r-lib/actions/setup-r@v2
      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libcairo2-dev libgit2-dev

      - name: Install R packages for rendering
        run: |
          Rscript -e 'install.packages(c(
            "tidyr","stringr","lubridate","dplyr","scales","scico","viridis",
            "htmlwidgets","htmltools","reactable","reactablefmtr",
            "wesanderson","RColorBrewer","here"
          ), repos="https://cloud.r-project.org")'

      - name: Render Quarto
        run: |
          quarto render reports/Eligiblity_table_2526/Eligibility_table.qmd --to html --output-dir docs
          quarto render reports/heatmap_districts/Heat_map_enroll.qmd         --to html --output-dir docs

      - name: Commit & push any changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No updates — nothing to commit."
          else
            git commit -m "Pipeline update $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push origin HEAD
          fi
