name: Full Data Pipeline

on:
  push:
    branches:
      - main
      - workflow-test 
  workflow_dispatch:
  schedule:
    - cron: '0 11 * 3-11 1-5'
    - cron: '0 19 * 3-11 1-5'
    - cron: '0 12 * 1,2,12 1-5'
    - cron: '0 20 * 1,2,12 1-5'

jobs:

  # =========================================================
  # JOB 1 — DOWNLOAD FROM DROPBOX
  # =========================================================
  download:
    runs-on: ubuntu-latest

    outputs:
      elig_file: ${{ steps.out.outputs.elig_file }}
      heat_file: ${{ steps.out.outputs.heat_file }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Python & Dropbox SDK
        run: pip install dropbox

      - name: Run Dropbox API Script
        run: python dropbox_api.py

      - name: Capture latest files
        id: out
        run: |
          elig=$(ls -1t reports/Eligiblity_table_2526/dropbox_data/* | head -n 1)
          heat=$(ls -1t reports/heatmap_districts/dropbox_data/* | head -n 1)
          echo "elig_file=$elig" >> $GITHUB_OUTPUT
          echo "heat_file=$heat" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: dropbox-eligibility
          path: ${{ steps.out.outputs.elig_file }}

      - uses: actions/upload-artifact@v4
        with:
          name: dropbox-heatmap
          path: ${{ steps.out.outputs.heat_file }}


  # =========================================================
  # JOB 2 — PROCESS ELIGIBILITY TABLE
  # =========================================================
  process-eligibility:
    runs-on: ubuntu-latest
    needs: download

    outputs:
      final_table:    ${{ steps.out.outputs.final_table }}
      nonmatch:       ${{ steps.out.outputs.nonmatch }}
      weekly_heatmap: ${{ steps.out.outputs.weekly_heatmap }}

    steps:
      - uses: actions/checkout@v4

      # Download into temporary directory to avoid overwriting
      - uses: actions/download-artifact@v4
        with:
          name: dropbox-eligibility
          path: temp/dropbox-eligibility/

      # Move only CSV files into the real folder and do NOT overwrite last_processed.txt
      - name: Move eligibility CSVs safely
        run: |
          mkdir -p reports/Eligiblity_table_2526/dropbox_data
          cp temp/dropbox-eligibility/*.csv reports/Eligiblity_table_2526/dropbox_data/

      - uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: Rscript -e 'install.packages(c("dplyr","tidyr","stringr","lubridate", "here"), repos="https://cloud.r-project.org")'

      - name: Run eligibility processing
        run: Rscript reports/Eligiblity_table_2526/setting_up_eligibility_data.R

      - name: Capture outputs
        id: out
        run: |
          final=$(ls -1t reports/Eligiblity_table_2526/data/final_table*.rds | head -n 1)
          nonmatch=$(ls -1t reports/Eligiblity_table_2526/nonmatch_data/non_match_district*.rds | head -n 1)
          heat=$(ls -1t reports/Eligiblity_table_2526/heatmapdataweekly/heat_mapweekly*.rds | head -n 1)

          echo "final_table=$final" >> $GITHUB_OUTPUT
          echo "nonmatch=$nonmatch" >> $GITHUB_OUTPUT
          echo "weekly_heatmap=$heat" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: eligibility-data
          path: |
            ${{ steps.out.outputs.final_table }}
            ${{ steps.out.outputs.nonmatch }}
            ${{ steps.out.outputs.weekly_heatmap }}


  # =========================================================
  # JOB 3 — PROCESS HEATMAPS
  # =========================================================
  process-heatmap:
    runs-on: ubuntu-latest
    needs: download

    outputs:
      heatmap_data:  ${{ steps.out.outputs.data }}
      heatmap_week:  ${{ steps.out.outputs.week }}
      reactable_def: ${{ steps.out.outputs.react }}

    steps:
      - uses: actions/checkout@v4

      # Download into temp directory
      - uses: actions/download-artifact@v4
        with:
          name: dropbox-heatmap
          path: temp/dropbox-heatmap/

      # Move safely
      - name: Move heatmap CSVs safely
        run: |
          mkdir -p reports/heatmap_districts/dropbox_data
          cp temp/dropbox-heatmap/*.csv reports/heatmap_districts/dropbox_data/

      - uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: Rscript -e 'install.packages(c("dplyr","tidyr","lubridate","reactable", "here"), repos="https://cloud.r-project.org")'

      - name: Run heatmap processing
        run: Rscript reports/heatmap_districts/setting_up_enrollment_heat.R

      - name: Capture outputs
        id: out
        run: |
          d=$(ls -1t reports/heatmap_districts/heatmapdata/*.rds | head -n 1)
          w=$(ls -1t reports/heatmap_districts/heatmapdataweekly/*.rds | head -n 1)
          r=$(ls -1t reports/heatmap_districts/reactable_element/*.rds | head -n 1)

          echo "data=$d"   >> $GITHUB_OUTPUT
          echo "week=$w"   >> $GITHUB_OUTPUT
          echo "react=$r"  >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: heatmap-data
          path: |
            ${{ steps.out.outputs.data }}
            ${{ steps.out.outputs.week }}
            ${{ steps.out.outputs.react }}


  # =========================================================
  # JOB 4 — RENDER + COMMIT EVERYTHING
  # =========================================================
  render:
    runs-on: ubuntu-latest
    needs: [process-eligibility, process-heatmap]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Download artifacts into temporary staging areas
      - uses: actions/download-artifact@v4
        with:
          name: dropbox-eligibility
          path: temp/eligibility/

      - uses: actions/download-artifact@v4
        with:
          name: eligibility-data
          path: temp/eligibility-data/

      - uses: actions/download-artifact@v4
        with:
          name: dropbox-heatmap
          path: temp/heatmap/

      - uses: actions/download-artifact@v4
        with:
          name: heatmap-data
          path: temp/heatmap-data/

      # Move files into repo without overwriting last_processed.txt
      - name: Merge artifact files safely
        run: |
          mkdir -p reports/Eligiblity_table_2526/dropbox_data
          mkdir -p reports/heatmap_districts/dropbox_data
          mkdir -p reports/Eligiblity_table_2526/data
          mkdir -p reports/Eligiblity_table_2526/nonmatch_data
          mkdir -p reports/Eligiblity_table_2526/heatmapdataweekly
          mkdir -p reports/heatmap_districts/heatmapdata
          mkdir -p reports/heatmap_districts/heatmapdataweekly
          mkdir -p reports/heatmap_districts/reactable_element

          cp temp/eligibility/*.csv reports/Eligiblity_table_2526/dropbox_data/ 2>/dev/null || true
          cp temp/eligibility-data/*.rds reports/Eligiblity_table_2526/ -R 2>/dev/null || true

          cp temp/heatmap/*.csv reports/heatmap_districts/dropbox_data/ 2>/dev/null || true
          cp temp/heatmap-data/*.rds reports/heatmap_districts/ -R 2>/dev/null || true

      - uses: r-lib/actions/setup-r@v2
      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libcairo2-dev libgit2-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c(
            "tidyr","stringr","lubridate","dplyr","scales","scico","viridis",
            "htmlwidgets","htmltools","reactable","reactablefmtr","wesanderson","RColorBrewer"
          ), repos="https://cloud.r-project.org")'

      - name: Render Quarto
        run: |
          quarto render reports/Eligiblity_table_2526/Eligibility_table.qmd --to html --output-dir docs
          quarto render reports/heatmap_districts/Heat_map_enroll.qmd --to html --output-dir docs

      # =============================================
      # COMMIT + PUSH ALL GENERATED FILES
      # =============================================
      - name: Commit and push generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git switch main
          git pull origin main

          echo "Checking changed files..."
          git status --short

          git add reports/Eligiblity_table_2526/dropbox_data/ || true
          git add reports/Eligiblity_table_2526/data/ || true
          git add reports/Eligiblity_table_2526/nonmatch_data/ || true
          git add reports/Eligiblity_table_2526/heatmapdataweekly/ || true

          git add reports/heatmap_districts/dropbox_data/ || true
          git add reports/heatmap_districts/heatmapdata/ || true
          git add reports/heatmap_districts/heatmapdataweekly/ || true
          git add reports/heatmap_districts/reactable_element/ || true

          git add docs/ || true

          # Ensure last_processed.txt is committed
          git add reports/Eligiblity_table_2526/dropbox_data/last_processed.txt || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Pipeline update $(date -u +'%Y-%m-%dT%H:%MZ') [skip ci]"
            git push origin main
          fi
