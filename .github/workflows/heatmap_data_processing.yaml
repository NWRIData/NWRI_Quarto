name: Heatmap R Data Processing

#on:
  workflow_run:
    workflows: ["Weekly Dropbox Download"]   # must exactly match Workflow A's name
    types:
      - completed

jobs:
  run-r-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: true  # needed for pushing commits
          fetch-depth: 0  # fetch full history for rebase

      - name: Restore last processed cache
        id: cache-last-processed
        uses: actions/cache@v4
        with:
          path: reports/heatmap_districts/dropbox_data/last_processed.txt
          key: last-processed-file-${{ hashFiles('reports/heatmap_districts/dropbox_data/last_processed.txt') }}

      - name: Ensure last_processed.txt exists
        run: |
          mkdir -p reports/heatmap_districts/dropbox_data
          if [ ! -f reports/heatmap_districts/dropbox_data/last_processed.txt ]; then
            echo " " > reports/heatmap_districts/dropbox_data/last_processed.txt
          fi

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("dplyr","here", "tidyr","lubridate"), repos = "https://cloud.r-project.org")'

      - name: Run data processing script
        run: |
          Rscript reports/heatmap_districts/setting_up_enrollment_heat.R

      - name: Save last processed file to cache
        if: always()
        uses: actions/cache@v4
        with:
          path: reports/heatmap_districts/dropbox_data/last_processed.txt
          key: last-processed-file-${{ hashFiles('reports/heatmap_districts/dropbox_data/last_processed.txt') }}

      - name: Commit and push updated files (rebase-safe)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stash any local changes to avoid pull conflicts
          git stash push --include-untracked -m "autosave before rebase" || true

          # Pull latest changes safely
          git pull --rebase origin main

          # Restore stashed changes
          git stash pop || true

          # Add updated files
          git add reports/heatmap_districts/data*.rds

          # Commit only if there are changes
          git diff --cached --quiet || git commit -m "Daily data update $(date -u +'%Y-%m-%d')"

          # Push back to main
          git push
