name: Render Single Quarto Doc

# Trigger only after another workflow finishes successfully
on:
  workflow_run:
    workflows: ["R Data Processing and Commit"]  # replace with your actual workflow name
    types:
      - completed

jobs:
  render-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push updates back to the repo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'

      - name: Install Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R packages
        run: |
          R -e 'install.packages(c("tidyverse","reactable","reactablefmtr","ggplot2","viridis", "htmlwidgets" , "scales", "htmltools"), repos="https://cloud.r-project.org")'

      - name: Render specific Quarto doc
        run: quarto render reports/Eligiblity_table_2526/Eligibility_table.qmd --to html --output-dir docs

      - name: Commit and push rendered HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/Eligibility_table.html
          git commit -m "Update rendered Eligibility Table"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
