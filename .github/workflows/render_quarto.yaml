# .github/workflows/render-quarto.yml
name: Render and Deploy Quarto

on:
  workflow_run:
    workflows: ["R Data Processing and Commit"]  # Must exactly match the name
    types:
      - completed

jobs:
  render:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R
        uses: r-lib/actions/setup-r@v2

      - name: Install deps
        run: Rscript -e 'install.packages(c("tidyverse","quarto"))'

      - name: Render site
        run: quarto render

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site   # or wherever Quarto outputs
