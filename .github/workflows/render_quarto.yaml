name: Render Single Quarto Doc

on:
  workflow_run:
    workflows: ["R Data Processing and Commit"]
    types:
      - completed

jobs:
  render-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libcairo2-dev \
            libgit2-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c(
            "dplyr",
            "ggplot2",
            "scales",
            "viridis",
            "wesanderson",
            "htmlwidgets",
            "htmltools",
            "reactable",
            "reactablefmtr"
          ), repos="https://cloud.r-project.org")'

      - name: Render specific Quarto doc
        run: quarto render reports/Eligiblity_table_2526/Eligibility_table.qmd --to html --output-dir docs

      - name: Commit and push rendered HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/Eligibility_table.html
          git commit -m "Update rendered Eligibility Table"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
