name: Render Single Quarto Doc

on:
  workflow_run:
    workflows: ["R Data Processing and Commit"]  # adjust if needed
    types:
      - completed

jobs:
  render-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'   # bump to 4.4 since MuMIn requires it

      - name: Install Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            tidyverse
            dplyr
            ggplot2
            reactable
            isaactaylor/reactablefmtr
            viridis
            htmlwidgets
            scales
            htmltools
            
          needs: |
            webfakes  # ensures pak can fetch GitHub packages

      - name: Render specific Quarto doc
        run: quarto render reports/Eligiblity_table_2526/Eligibility_table.qmd --to html --output-dir docs

      - name: Commit and push rendered HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/Eligibility_table.html
          git commit -m "Update rendered Eligibility Table"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
